<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 - Page Not Found</title>
  <style>
    body {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      background: #050506;
      color: #D4D4D8;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: #111114;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 40px;
      text-align: center;
      max-width: 480px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }
    h1 {
      font-size: 72px;
      margin: 0;
      color: #ffffff;
      font-weight: 800;
      letter-spacing: -2px;
    }
    h2 {
      font-size: 20px;
      margin: 10px 0 20px 0;
      color: #8A8A90;
      font-weight: 500;
    }
    p {
      font-size: 14px;
      line-height: 1.6;
      color: #8A8A90;
      margin-bottom: 30px;
    }
    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .link-btn {
      display: inline-block;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .link-btn.secondary {
      background: transparent;
      color: #D4D4D8;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .link-btn.secondary:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
    <div class="links">
      <a href="/privacy-policy" class="link-btn secondary">Privacy Policy</a>
      <a href="/TERMS_OF_SERVICE" class="link-btn secondary">Terms of Service</a>
    </div>
  </div>
</body>
</html>
